services:
  traefik:
    image: traefik:v3.1
    container_name: bullflow-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8880"
      - "--entrypoints.websecure.address=:8443"
      - "--api.dashboard=false"
    ports:
      - "8880:8880"
      - "8443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    container_name: bullflow-postgres
    env_file:
      - ../.env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: bullflow-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - app-net

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: bullflow-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: bullflow-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    networks:
      - app-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: bullflow-web
    depends_on:
      - api
    env_file:
      - ../.env
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=4173"

networks:
  app-net:

volumes:
  pg-data:
